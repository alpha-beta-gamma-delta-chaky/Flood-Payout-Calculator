# Daily check that the live site works, from outside the server (a GitHub-hosted runner).
#
# Runs every day at 08:17 Bangkok time (01:17 UTC), and by hand from Actions -> "health" -> Run workflow.
# A failed run shows red in the Actions tab, and GitHub emails the person who last changed this file.
# While the server is stopped on purpose, this check fails: disable the workflow in the Actions tab
# ("..." -> Disable workflow) and enable it again when the server is back.
name: health

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_HOST: flood-payout-alpha.duckdns.org

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test the live site
        run: python3 scripts/smoke_test.py "https://$SITE_HOST" --wait 60

      - name: Check the HTTPS certificate is not about to expire
        run: |
          python3 - <<'EOF'
          import datetime, os, socket, ssl
          host = os.environ["SITE_HOST"]
          with socket.create_connection((host, 443), timeout=15) as raw:
              with ssl.create_default_context().wrap_socket(raw, server_hostname=host) as tls:
                  cert = tls.getpeercert()
          expires = datetime.datetime.fromtimestamp(ssl.cert_time_to_seconds(cert["notAfter"]), datetime.UTC)
          days = (expires - datetime.datetime.now(datetime.UTC)).days
          print(f"Certificate for {host} expires {expires:%d %b %Y} ({days} days left)")
          if days < 7:
              print("::error::The certificate expires in under 7 days. Caddy should renew it by itself: check the server.")
              raise SystemExit(1)
          EOF
